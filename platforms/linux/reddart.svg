<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <linearGradient id="dartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="#262A36" stroke-width="4" />

  <!-- Timeline Guide Tracks -->
  <rect x="36" y="72" width="130" height="18" rx="6" fill="#2563EB" opacity="0.4" />
  <rect x="36" y="104" width="100" height="18" rx="6" fill="#10B981" opacity="0.4" />
  <rect x="36" y="136" width="140" height="18" rx="6" fill="#7C569A" opacity="0.4" />
  <rect x="36" y="168" width="115" height="18" rx="6" fill="#D97706" opacity="0.4" />

  <!-- Dynamic Reddart Velocity Arrow / Playhead Needle -->
  <path d="M 68 50 L 196 128 L 68 206 L 102 128 Z" fill="url(#dartGrad)" filter="url(#glow)" />
  <path d="M 102 128 L 68 50 L 196 128 Z" fill="#F87171" opacity="0.4" />

  <!-- Zero-Lag Laser Playhead Line -->
  <line x1="196" y1="36" x2="196" y2="220" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.75" />
</svg>

