name: CI

on:
  push:
    branches: [main, master, develop, "integration/*", "feat/*"]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (Workspace & All Targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build locked release binary
        run: cargo build --release --locked -p reddart-windows

  test-windows:
    name: Windows App & Integration Suite
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg on Windows
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify FFmpeg availability
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Windows Workspace Tests (Enforced FFmpeg)
        env:
          CI: "true"
          REDDART_REQUIRE_FFMPEG: "1"
        run: cargo test --workspace -- --nocapture

      - name: Verify Package & Bit-for-Bit Reproducibility
        shell: pwsh
        run: |
          ./scripts/package_windows.ps1 -VerifyReproducibility

  clean-machine-qa:
    name: Clean Machine QA (Zero Cache)
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Run Clean Machine FFmpeg Setup
        shell: pwsh
        run: |
          ./scripts/setup_ffmpeg.ps1

      - name: Execute Clean Machine QA Test Suite
        env:
          CI: "true"
          REDDART_REQUIRE_FFMPEG: "1"
        run: cargo test -p reddart-windows --test clean_machine_qa_test -- --nocapture

  test-cross-platform:
    name: Core Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux audio and media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config ffmpeg desktop-file-utils zip

      - name: Install macOS media dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cross-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Core Engine Tests
        run: cargo test --workspace --exclude reddart-windows -- --nocapture

      - name: Verify Linux Standalone Packaging
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh --skip-build --verify-reproducibility

      - name: Verify macOS Universal App Packaging
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/package_mac.sh
          ./scripts/package_mac.sh --skip-build
