name: "💡 Feature Request"
description: "Suggest a new feature, editing tool, shader effect, or workflow improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We prioritize features based on creator ergonomics, performance impact, and architectural alignment.

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Is your feature request related to a specific workflow bottleneck or missing capability?"
      placeholder: "e.g. When editing multi-camera interviews, syncing audio tracks manually takes too long..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
      description: "Describe the proposed solution, UI design, or keyboard shortcut mapping."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions, workarounds, or legacy NLE behaviors you considered."

